---
- name: Server Security Hardening (U-Code Compliance)
  hosts: all_servers
  become: yes

  pre_tasks:
    # -------------------------------------------------------
    # Pre-Check: Verify Critical Files Exist
    # -------------------------------------------------------
    - name: "[Pre-Check] Display pre-check banner"
      debug:
        msg: "Starting pre-check to verify critical files exist..."
      tags: ['always']

    - name: "[Pre-Check] Check if sshd_config exists"
      stat:
        path: /etc/ssh/sshd_config
      register: sshd_config_stat
      tags: ['always']

    - name: "[Pre-Check] Check if PAM files exist"
      stat:
        path: "{{ item }}"
      register: pam_files_stat
      loop:
        - /etc/pam.d/common-password
        - /etc/pam.d/common-auth
        - /etc/pam.d/common-account
      tags: ['always']

    - name: "[Pre-Check] Check if login.defs exists"
      stat:
        path: /etc/login.defs
      register: login_defs_stat
      tags: ['always']

    - name: "[Pre-Check] Check if profile exists"
      stat:
        path: /etc/profile
      register: profile_stat
      tags: ['always']

    - name: "[Pre-Check] Check if shadow exists"
      stat:
        path: /etc/shadow
      register: shadow_stat
      tags: ['always']

    - name: "[Pre-Check] Check if rsyslog.conf exists"
      stat:
        path: /etc/rsyslog.conf
      register: rsyslog_stat
      tags: ['always']

    - name: "[Pre-Check] Check if SUID binaries exist"
      stat:
        path: "{{ item }}"
      register: suid_files_stat
      loop:
        - /usr/bin/newgrp
        - /sbin/unix_chkpwd
      tags: ['always']

    - name: "[Pre-Check] Check if crontab binary exists"
      stat:
        path: /usr/bin/crontab
      register: crontab_stat
      tags: ['always']

    - name: "[Pre-Check] Check if Apache config exists (web_controllers only)"
      stat:
        path: /etc/apache2/apache2.conf
      register: apache_config_stat
      when: "'web_controllers' in group_names"
      tags: ['always']

    - name: "[Pre-Check] Display missing critical files warning"
      debug:
        msg: |
          WARNING: The following critical files are missing:
          {% if not sshd_config_stat.stat.exists %}
          - /etc/ssh/sshd_config (U-01 will be skipped)
          {% endif %}
          {% if not login_defs_stat.stat.exists %}
          - /etc/login.defs (U-46, U-47 will be skipped)
          {% endif %}
          {% if not profile_stat.stat.exists %}
          - /etc/profile (U-54 will be skipped)
          {% endif %}
          {% if not shadow_stat.stat.exists %}
          - /etc/shadow (U-08 will be skipped)
          {% endif %}
          {% if not rsyslog_stat.stat.exists %}
          - /etc/rsyslog.conf (U-11 will be skipped)
          {% endif %}
          {% if 'web_controllers' in group_names and apache_config_stat is defined and not apache_config_stat.stat.exists %}
          - /etc/apache2/apache2.conf (Apache hardening will be skipped)
          {% endif %}
      when: >
        not sshd_config_stat.stat.exists or
        not login_defs_stat.stat.exists or
        not profile_stat.stat.exists or
        not shadow_stat.stat.exists or
        not rsyslog_stat.stat.exists or
        ('web_controllers' in group_names and apache_config_stat is defined and not apache_config_stat.stat.exists)
      tags: ['always']

    - name: "[Pre-Check] Set facts for file existence"
      set_fact:
        has_sshd_config: "{{ sshd_config_stat.stat.exists | default(false) }}"
        has_pam_password: "{{ pam_files_stat.results[0].stat.exists | default(false) }}"
        has_pam_auth: "{{ pam_files_stat.results[1].stat.exists | default(false) }}"
        has_pam_account: "{{ pam_files_stat.results[2].stat.exists | default(false) }}"
        has_login_defs: "{{ login_defs_stat.stat.exists | default(false) }}"
        has_profile: "{{ profile_stat.stat.exists | default(false) }}"
        has_shadow: "{{ shadow_stat.stat.exists | default(false) }}"
        has_rsyslog: "{{ rsyslog_stat.stat.exists | default(false) }}"
        has_crontab: "{{ crontab_stat.stat.exists | default(false) }}"
        has_apache_config: "{{ apache_config_stat.stat.exists | default(false) }}"
      tags: ['always']

    - name: "[Pre-Check] Display completion message"
      debug:
        msg: "Pre-check completed. Proceeding with security hardening tasks..."
      tags: ['always']

    - name: "[Confirmation] Pre-checks passed. Ready to apply changes?"
      pause:
        prompt: |

          ============================================================
          모든 필수 파일 검사가 완료되었습니다.

          보안 설정을 적용하시겠습니까?

          - Enter를 누르면 진행합니다
          - Ctrl+C를 누른 뒤 'A'를 입력하면 중단합니다

          자동 실행 시 --extra-vars "skip_confirmation=true" 사용
          ============================================================
      when: not (skip_confirmation | default(false))
      tags: ['always']

  handlers:
    - name: restart sshd
      service:
        name: sshd
        state: restarted

    - name: restart apache2
      service:
        name: apache2
        state: restarted

  tasks:
    # -------------------------------------------------------
    # U-01: Root Login Restriction
    # -------------------------------------------------------
    - name: "[U-01] Restrict Root Login in sshd_config"
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PermitRootLogin'
        line: 'PermitRootLogin no'
        state: present
      notify: restart sshd
      when: has_sshd_config | default(false)
      tags: ['u-01', 'ssh']

    - name: "[U-01] Warning - sshd_config not found"
      debug:
        msg: "WARNING: /etc/ssh/sshd_config not found. Skipping U-01 configuration."
      when: not has_sshd_config | default(true)
      tags: ['u-01', 'ssh']

    # -------------------------------------------------------
    # U-02, U-03: PAM Configuration
    # -------------------------------------------------------
    - name: "[U-03] Install libpam-pwquality"
      apt:
        name: libpam-pwquality
        state: present
        update_cache: yes
      tags: ['u-03', 'pam']

    - name: "[U-02] Backup /etc/pam.d/common-password"
      copy:
        src: /etc/pam.d/common-password
        dest: /etc/pam.d/common-password_org
        remote_src: yes
        force: no
      when: has_pam_password | default(false)
      tags: ['u-02', 'pam']

    - name: "[U-02] Configure /etc/pam.d/common-password"
      template:
        src: templates/common-password.j2
        dest: /etc/pam.d/common-password
        backup: yes
        mode: '0644'
      when: has_pam_password | default(false)
      tags: ['u-02', 'pam']

    - name: "[U-02] Warning - common-password not found"
      debug:
        msg: "WARNING: /etc/pam.d/common-password not found. Skipping U-02 configuration."
      when: not has_pam_password | default(true)
      tags: ['u-02', 'pam']

    - name: "[U-03] Backup /etc/pam.d/common-auth"
      copy:
        src: /etc/pam.d/common-auth
        dest: /etc/pam.d/common-auth_org
        remote_src: yes
        force: no
      when: has_pam_auth | default(false)
      tags: ['u-03', 'pam']

    - name: "[U-03] Configure /etc/pam.d/common-auth"
      template:
        src: templates/common-auth.j2
        dest: /etc/pam.d/common-auth
        backup: yes
        mode: '0644'
      when: has_pam_auth | default(false)
      tags: ['u-03', 'pam']

    - name: "[U-03] Backup /etc/pam.d/common-account"
      copy:
        src: /etc/pam.d/common-account
        dest: /etc/pam.d/common-account_org
        remote_src: yes
        force: no
      when: has_pam_account | default(false)
      tags: ['u-03', 'pam']

    - name: "[U-03] Update /etc/pam.d/common-account"
      blockinfile:
        path: /etc/pam.d/common-account
        block: |
          account required                        pam_faillock.so
        marker: "# {mark} ANSIBLE MANAGED BLOCK U-03"
        backup: yes
      when: has_pam_account | default(false)
      tags: ['u-03', 'pam']

    - name: "[U-03] Warning - PAM files not found"
      debug:
        msg: "WARNING: One or more PAM files not found. Skipping U-03 configuration."
      when: not (has_pam_auth | default(false)) or not (has_pam_account | default(false))
      tags: ['u-03', 'pam']

    # -------------------------------------------------------
    # U-47, U-46: Password Aging (login.defs)
    # -------------------------------------------------------
    - name: "[U-47] Set PASS_MAX_DAYS to {{ password_max_days }}"
      lineinfile:
        path: /etc/login.defs
        regexp: '^PASS_MAX_DAYS'
        line: 'PASS_MAX_DAYS	{{ password_max_days }}'
      when: has_login_defs | default(false)
      tags: ['u-47', 'password']

    - name: "[U-46] Set PASS_MIN_LEN to {{ password_min_len }}"
      lineinfile:
        path: /etc/login.defs
        regexp: '^#?PASS_MIN_LEN'
        line: 'PASS_MIN_LEN	{{ password_min_len }}'
      when: has_login_defs | default(false)
      tags: ['u-46', 'password']

    - name: "[U-46] Set PASS_MIN_DAYS to {{ password_min_days }}"
      lineinfile:
        path: /etc/login.defs
        regexp: '^PASS_MIN_DAYS'
        line: 'PASS_MIN_DAYS	{{ password_min_days }}'
      when: has_login_defs | default(false)
      tags: ['u-46', 'password']

    - name: "[U-46/U-47] Warning - login.defs not found"
      debug:
        msg: "WARNING: /etc/login.defs not found. Skipping password policy configuration."
      when: not has_login_defs | default(true)
      tags: ['u-46', 'u-47', 'password']

    # -------------------------------------------------------
    # U-54: Session Timeout
    # -------------------------------------------------------
    - name: "[U-54] Set TMOUT in /etc/profile"
      blockinfile:
        path: /etc/profile
        block: |
          TMOUT={{ session_timeout }}
          export TMOUT
        marker: "# {mark} ANSIBLE MANAGED BLOCK U-54"
      when: has_profile | default(false)
      tags: ['u-54', 'session']

    - name: "[U-54] Warning - profile not found"
      debug:
        msg: "WARNING: /etc/profile not found. Skipping session timeout configuration."
      when: not has_profile | default(true)
      tags: ['u-54', 'session']

    # -------------------------------------------------------
    # U-08, U-11: File Permissions
    # -------------------------------------------------------
    - name: "[U-08] Change permissions of /etc/shadow"
      file:
        path: /etc/shadow
        mode: '0400'
      when: has_shadow | default(false)
      tags: ['u-08', 'permissions']

    - name: "[U-08] Warning - shadow not found"
      debug:
        msg: "WARNING: /etc/shadow not found. Skipping shadow file permissions."
      when: not has_shadow | default(true)
      tags: ['u-08', 'permissions']

    - name: "[U-11] Change permissions of /etc/rsyslog.conf"
      file:
        path: /etc/rsyslog.conf
        mode: '0640'
      when: has_rsyslog | default(false)
      tags: ['u-11', 'permissions']

    - name: "[U-11] Warning - rsyslog.conf not found"
      debug:
        msg: "WARNING: /etc/rsyslog.conf not found. Skipping rsyslog permissions."
      when: not has_rsyslog | default(true)
      tags: ['u-11', 'permissions']

    # -------------------------------------------------------
    # U-13: Remove SUID/SGID
    # -------------------------------------------------------
    - name: "[U-13] Remove SUID from newgrp and unix_chkpwd"
      file:
        path: "{{ item }}"
        mode: "u-s"
      loop:
        - /usr/bin/newgrp
        - /sbin/unix_chkpwd
      ignore_errors: yes
      tags: ['u-13', 'suid']

    # -------------------------------------------------------
    # U-49, U-50: Remove Unnecessary Users/Groups
    # -------------------------------------------------------
    - name: "[U-49] Remove unnecessary users"
      user:
        name: "{{ item }}"
        state: absent
        remove: yes
      loop:
        - lp
        - uucp
        - games
      ignore_errors: yes
      tags: ['u-49', 'users']

    - name: "[U-50] Remove unnecessary groups"
      group:
        name: "{{ item }}"
        state: absent
      loop:
        - lp
        - uucp
        - games
      ignore_errors: yes
      tags: ['u-50', 'groups']

    # -------------------------------------------------------
    # U-22: Cron Allow
    # -------------------------------------------------------
    - name: "[U-22] Configure /etc/cron.allow"
      template:
        src: templates/cron.allow.j2
        dest: /etc/cron.allow
        mode: '0640'
      tags: ['u-22', 'cron']

    - name: "[U-22] Restrict crontab binary permission"
      file:
        path: /usr/bin/crontab
        mode: '0750'
      when: has_crontab | default(false)
      tags: ['u-22', 'cron']

    - name: "[U-22] Warning - crontab binary not found"
      debug:
        msg: "WARNING: /usr/bin/crontab not found. Skipping crontab permissions."
      when: not has_crontab | default(true)
      tags: ['u-22', 'cron']

    # -------------------------------------------------------
    # U-68: Warning Banners
    # -------------------------------------------------------
    - name: "[U-68] Configure /etc/issue.net"
      copy:
        content: 'BANNER="WARNING:Authorized use only."'
        dest: /etc/issue.net
        mode: '0644'
      tags: ['u-68', 'banner']

    - name: "[U-68] Configure /etc/issue"
      template:
        src: templates/issue.j2
        dest: /etc/issue
        mode: '0644'
      tags: ['u-68', 'banner']

    - name: "[U-68] Configure /etc/motd"
      template:
        src: templates/motd.j2
        dest: /etc/motd
        mode: '0644'
      tags: ['u-68', 'banner']

    # -------------------------------------------------------
    # Apache Configuration (web_controllers Only)
    # -------------------------------------------------------
    - name: "[Apache] Configure Apache Security Settings"
      block:
        - name: "[U-35,U-39,U-37] Backup apache2.conf"
          copy:
            src: /etc/apache2/apache2.conf
            dest: /etc/apache2/apache2.conf_org
            remote_src: yes
            force: no

        - name: "[U-35] Disable Indexes option - Add minus sign"
          replace:
            path: /etc/apache2/apache2.conf
            regexp: '(\s+Options\s+)Indexes'
            replace: '\1-Indexes'
            backup: yes

        - name: "[U-39] Disable FollowSymLinks - Add minus sign"
          replace:
            path: /etc/apache2/apache2.conf
            regexp: '(\s+Options\s+.*)(?<![- ])FollowSymLinks'
            replace: '\1-FollowSymLinks'

        - name: "[U-37] Change AllowOverride to AuthConfig"
          replace:
            path: /etc/apache2/apache2.conf
            regexp: '(\s+)AllowOverride None'
            replace: '\1AllowOverride AuthConfig'

        - name: "[U-35] Verify Indexes disabled"
          command: grep -E "(Options.*Indexes|Options -Indexes)" /etc/apache2/apache2.conf
          register: u35_check
          changed_when: false
          failed_when: false

        - name: "[U-39] Verify FollowSymLinks disabled"
          command: grep "FollowSymLinks" /etc/apache2/apache2.conf
          register: u39_check
          changed_when: false
          failed_when: false

        - name: "[U-37] Verify AllowOverride set"
          command: grep "AllowOverride" /etc/apache2/apache2.conf
          register: u37_check
          changed_when: false
          failed_when: false

        - name: "[U-40] Comment out entire /srv/ directory block"
          shell: |
            # Check if /srv/ block exists and is not already commented
            if grep -q "^<Directory /srv/>" /etc/apache2/apache2.conf; then
              # Comment out all lines in the /srv/ directory block
              sed -i '/<Directory \/srv\/>/,/<\/Directory>/ { /^[^#]/ s/^/#/ }' /etc/apache2/apache2.conf
              echo "Commented out /srv/ directory block"
            elif grep -q "^#<Directory /srv/>" /etc/apache2/apache2.conf; then
              echo "/srv/ directory block already commented"
            else
              echo "/srv/ directory block not found"
            fi
          args:
            executable: /bin/bash
          register: u40_result
          changed_when: "'Commented out' in u40_result.stdout"

        - name: "[U-40] Display result"
          debug:
            msg: "{{ u40_result.stdout }}"

        - name: "[U-41] Add DocumentRoot for repo"
          lineinfile:
            path: /etc/apache2/apache2.conf
            line: "DocumentRoot /var/www/repo"
            insertafter: EOF
            state: present

        - name: "[U-41] Verify DocumentRoot set"
          command: grep "DocumentRoot" /etc/apache2/apache2.conf
          register: u41_check
          changed_when: false
          failed_when: false

      when:
        - "'web_controllers' in group_names"
        - has_apache_config | default(false)
      notify: restart apache2
      tags: ['apache', 'u-35', 'u-37', 'u-39', 'u-40', 'u-41']

    - name: "[Apache] Warning - Apache config not found"
      debug:
        msg: "WARNING: /etc/apache2/apache2.conf not found. Skipping Apache hardening configuration."
      when:
        - "'web_controllers' in group_names"
        - not has_apache_config | default(true)
      tags: ['apache']

    # -------------------------------------------------------
    # Final Verification
    # -------------------------------------------------------
    - name: "[Verification] Display password policy settings"
      command: grep -E "PASS_MIN_LEN|PASS_MAX_DAYS|PASS_MIN_DAYS" /etc/login.defs
      register: password_policy
      changed_when: false
      failed_when: false
      when: has_login_defs | default(false)
      tags: ['verify']

    - name: "[Verification] Display password policy results"
      debug:
        var: password_policy.stdout_lines
      when:
        - has_login_defs | default(false)
        - password_policy.stdout_lines is defined
      tags: ['verify']

    - name: "[Verification] Check removed users"
      command: grep -E "lp|uucp|game" /etc/passwd
      register: removed_users
      changed_when: false
      failed_when: false
      tags: ['verify']

    - name: "[Verification] Display removed users check"
      debug:
        msg: "{{ 'Users still present: ' + removed_users.stdout if removed_users.rc == 0 else 'All unnecessary users removed' }}"
      tags: ['verify']

    - name: "[Verification] Check removed groups"
      command: grep -E "lp|uucp|game" /etc/group
      register: removed_groups
      changed_when: false
      failed_when: false
      tags: ['verify']

    - name: "[Verification] Display removed groups check"
      debug:
        msg: "{{ 'Groups still present: ' + removed_groups.stdout if removed_groups.rc == 0 else 'All unnecessary groups removed' }}"
      tags: ['verify']

    - name: "[Verification] Check cron.allow contents"
      command: cat /etc/cron.allow
      register: cron_allow
      changed_when: false
      failed_when: false
      tags: ['verify']

    - name: "[Verification] Display cron.allow contents"
      debug:
        var: cron_allow.stdout_lines
      when: cron_allow.stdout_lines is defined
      tags: ['verify']

  post_tasks:
    # -------------------------------------------------------
    # Summary Report: Display detailed results
    # -------------------------------------------------------
    - name: "[Summary] Generate security hardening report"
      debug:
        msg: |

          ╔══════════════════════════════════════════════════════════════╗
          ║        보안 강화 작업 완료 리포트 (Summary Report)           ║
          ╚══════════════════════════════════════════════════════════════╝

          📋 호스트: {{ inventory_hostname }}
          📅 완료 시각: {{ ansible_date_time.iso8601 }}

          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
          ✅ 적용된 보안 항목
          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

          [계정 및 인증]
          {% if has_sshd_config %}  ✓ U-01: SSH Root 로그인 제한{% else %}  ⊗ U-01: Skipped (sshd_config not found){% endif %}

          {% if has_pam_password %}  ✓ U-02: 패스워드 복잡도 설정 (PAM){% else %}  ⊗ U-02: Skipped (common-password not found){% endif %}

          {% if has_pam_auth and has_pam_account %}  ✓ U-03: 계정 잠금 임계값 설정 (5회/120초){% else %}  ⊗ U-03: Skipped (PAM files not found){% endif %}

          {% if has_login_defs %}  ✓ U-46: 패스워드 최소 길이 ({{ password_min_len }}자){% else %}  ⊗ U-46: Skipped (login.defs not found){% endif %}

          {% if has_login_defs %}  ✓ U-47: 패스워드 최대 사용기간 ({{ password_max_days }}일){% else %}  ⊗ U-47: Skipped (login.defs not found){% endif %}

            ✓ U-49: 불필요한 계정 제거 (lp, uucp, games)
            ✓ U-50: 불필요한 그룹 제거 (lp, uucp, games)

          [파일 및 디렉토리]
          {% if has_shadow %}  ✓ U-08: /etc/shadow 권한 강화 (400){% else %}  ⊗ U-08: Skipped (shadow not found){% endif %}

          {% if has_rsyslog %}  ✓ U-11: /etc/rsyslog.conf 권한 강화 (640){% else %}  ⊗ U-11: Skipped (rsyslog.conf not found){% endif %}

            ✓ U-13: SUID/SGID 비트 제거

          [서비스 관리]
            ✓ U-22: Cron 접근 제어 설정
          {% if has_crontab %}  ✓ U-22: Crontab 바이너리 권한 (750){% else %}  ⊗ U-22: Partial (crontab binary not found){% endif %}

          {% if has_profile %}  ✓ U-54: 세션 타임아웃 ({{ session_timeout }}초){% else %}  ⊗ U-54: Skipped (profile not found){% endif %}

            ✓ U-68: 경고 배너 설정 (/etc/issue, /etc/motd)

          {% if 'web_controllers' in group_names %}
          [Apache 웹 서버]
          {% if has_apache_config %}  ✓ U-35: 디렉토리 인덱싱 비활성화
            ✓ U-37: AllowOverride 설정
            ✓ U-39: FollowSymLinks 비활성화
            ✓ U-40: /srv/ 디렉토리 제한
            ✓ U-41: DocumentRoot 설정
          {% else %}  ⊗ Apache: Skipped (apache2.conf not found)
          {% endif %}
          {% endif %}

          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
          📊 통계 (PLAY RECAP 참조)
          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

          - ok: 성공한 작업 (변경 없음 포함)
          - changed: 실제로 변경된 항목
          - skipped: 조건 불충족으로 건너뛴 항목
          - failed: 실패한 작업

          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
          💡 다음 단계
          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

          1. 설정 파일 백업 확인: *_org 파일이 생성되었는지 확인
          2. 서비스 재시작: sshd, apache2 등이 정상 재시작되었는지 확인
          3. 로그인 테스트: 새 세션에서 로그인이 정상 작동하는지 확인
          4. PAM 설정 확인: 패스워드 정책이 올바르게 적용되었는지 테스트

          ⚠️  주의: PAM 설정 변경 시 현재 세션을 유지한 채로
                   새 터미널에서 로그인 테스트를 반드시 수행하세요!

          ╚══════════════════════════════════════════════════════════════╝
      tags: ['always']

    - name: "[Summary] Save report to file"
      copy:
        content: |
          ============================================================
          보안 강화 작업 완료 리포트
          ============================================================

          호스트: {{ inventory_hostname }}
          완료 시각: {{ ansible_date_time.iso8601 }}
          플레이북 실행 사용자: {{ ansible_user_id }}

          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
          적용된 보안 항목
          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

          [계정 및 인증]
          {% if has_sshd_config %}✓ U-01: SSH Root 로그인 제한{% else %}⊗ U-01: Skipped{% endif %}

          {% if has_pam_password %}✓ U-02: 패스워드 복잡도 설정{% else %}⊗ U-02: Skipped{% endif %}

          {% if has_pam_auth and has_pam_account %}✓ U-03: 계정 잠금 임계값 설정{% else %}⊗ U-03: Skipped{% endif %}

          {% if has_login_defs %}✓ U-46: 패스워드 최소 길이 ({{ password_min_len }}자){% else %}⊗ U-46: Skipped{% endif %}

          {% if has_login_defs %}✓ U-47: 패스워드 최대 사용기간 ({{ password_max_days }}일){% else %}⊗ U-47: Skipped{% endif %}

          ✓ U-49: 불필요한 계정 제거
          ✓ U-50: 불필요한 그룹 제거

          [파일 및 디렉토리]
          {% if has_shadow %}✓ U-08: /etc/shadow 권한 (400){% else %}⊗ U-08: Skipped{% endif %}

          {% if has_rsyslog %}✓ U-11: /etc/rsyslog.conf 권한 (640){% else %}⊗ U-11: Skipped{% endif %}

          ✓ U-13: SUID/SGID 제거

          [서비스 관리]
          ✓ U-22: Cron 접근 제어
          {% if has_profile %}✓ U-54: 세션 타임아웃 ({{ session_timeout }}초){% else %}⊗ U-54: Skipped{% endif %}

          ✓ U-68: 경고 배너 설정

          {% if 'web_controllers' in group_names %}
          [Apache 웹 서버]
          {% if has_apache_config %}✓ U-35~U-41: Apache 보안 설정 완료{% else %}⊗ Apache: Skipped{% endif %}
          {% endif %}

          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
          변경된 파일 백업 위치
          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

          - /etc/pam.d/common-password_org
          - /etc/pam.d/common-auth_org
          - /etc/pam.d/common-account_org
          - /etc/apache2/apache2.conf_org (web_controllers만)

          Ansible 자동 백업: *.backup 파일들

          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
          다음 단계
          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

          1. 로그인 테스트 수행 (새 세션에서)
          2. 패스워드 정책 테스트
          3. Apache 설정 확인 (web_controllers)
          4. 보안 점검 재실행으로 적용 확인

          ============================================================
        dest: "/tmp/security_hardening_report_{{ inventory_hostname }}_{{ ansible_date_time.date }}.txt"
        mode: '0644'
      delegate_to: localhost
      tags: ['always']

    - name: "[Summary] Report saved notification"
      debug:
        msg: |
          📄 상세 리포트가 저장되었습니다:
          /tmp/security_hardening_report_{{ inventory_hostname }}_{{ ansible_date_time.date }}.txt
      tags: ['always']
