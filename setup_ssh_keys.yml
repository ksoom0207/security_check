---
- name: SSH Key Exchange Setup for Security Hardening
  hosts: localhost
  gather_facts: yes

  vars_prompt:
    - name: remote_user
      prompt: "Enter remote username (default: current user)"
      private: no
      default: "{{ lookup('env', 'USER') }}"

    - name: ssh_password
      prompt: "Enter SSH password for remote hosts"
      private: yes

  tasks:
    - name: "[Setup] Display setup information"
      debug:
        msg: |
          ============================================================
          SSH 키 교환 설정 시작
          ============================================================

          이 플레이북은 다음 작업을 수행합니다:
          1. sshpass 패키지 설치 (필요한 경우)
          2. SSH 키 생성 (없는 경우)
          3. inventory의 모든 호스트에 SSH 공개키 복사

          대상 호스트: {{ groups['all_servers'] | length }}개
          원격 사용자: {{ remote_user }}
          ============================================================

    - name: "[Setup] Check if sshpass is installed"
      command: which sshpass
      register: sshpass_check
      changed_when: false
      failed_when: false

    - name: "[Setup] Install sshpass"
      apt:
        name: sshpass
        state: present
        update_cache: yes
      become: yes
      when: sshpass_check.rc != 0

    - name: "[Setup] Check if SSH key exists"
      stat:
        path: "{{ ansible_env.HOME }}/.ssh/id_rsa"
      register: ssh_key_stat

    - name: "[Setup] Generate SSH key pair"
      command: ssh-keygen -t rsa -b 4096 -f {{ ansible_env.HOME }}/.ssh/id_rsa -N "" -C "ansible-security-hardening"
      when: not ssh_key_stat.stat.exists

    - name: "[Setup] Display SSH public key"
      command: cat {{ ansible_env.HOME }}/.ssh/id_rsa.pub
      register: ssh_pubkey
      changed_when: false

    - name: "[Setup] Show public key"
      debug:
        msg: |
          생성된 SSH 공개키:
          {{ ssh_pubkey.stdout }}

    - name: "[Setup] Read inventory hosts"
      set_fact:
        target_hosts: "{{ groups['all_servers'] }}"

    - name: "[Setup] Copy SSH key to all servers"
      shell: |
        sshpass -p "{{ ssh_password }}" ssh-copy-id -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null {{ remote_user }}@{{ hostvars[item].ansible_host | default(item) }}
      loop: "{{ target_hosts }}"
      register: ssh_copy_result
      ignore_errors: yes

    - name: "[Setup] Display results"
      debug:
        msg: |
          ============================================================
          SSH 키 교환 결과
          ============================================================

          {% for result in ssh_copy_result.results %}
          호스트: {{ result.item }}
          상태: {% if result.rc == 0 %}✓ 성공{% else %}✗ 실패{% endif %}
          {% if result.rc != 0 %}
          오류: {{ result.stderr | default('알 수 없는 오류') }}
          {% endif %}
          {% endfor %}

          ============================================================

    - name: "[Setup] Test SSH connection to all hosts"
      command: ssh -o BatchMode=yes -o ConnectTimeout=5 {{ remote_user }}@{{ hostvars[item].ansible_host | default(item) }} echo "SSH connection successful"
      loop: "{{ target_hosts }}"
      register: ssh_test_result
      changed_when: false
      ignore_errors: yes

    - name: "[Setup] Display connection test results"
      debug:
        msg: |
          ============================================================
          SSH 연결 테스트 결과
          ============================================================

          {% for result in ssh_test_result.results %}
          호스트: {{ result.item }}
          상태: {% if result.rc == 0 %}✓ 연결 성공{% else %}✗ 연결 실패{% endif %}
          {% endfor %}

          ============================================================

          {% if ssh_test_result.results | selectattr('rc', 'equalto', 0) | list | length == target_hosts | length %}
          ✓ 모든 호스트에 SSH 키 인증이 성공적으로 설정되었습니다!
          이제 보안 강화 플레이북을 실행할 수 있습니다:

          ansible-playbook -i inventory.ini harden_playbook.yml
          {% else %}
          ⚠ 일부 호스트의 SSH 키 설정에 실패했습니다.
          실패한 호스트를 확인하고 다시 시도하세요.
          {% endif %}
          ============================================================

    - name: "[Setup] Fail if any host connection failed"
      fail:
        msg: "일부 호스트의 SSH 연결에 실패했습니다. 위의 결과를 확인하세요."
      when: ssh_test_result.results | selectattr('rc', 'ne', 0) | list | length > 0
